<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Modern square with rounded corners -->
  <rect x="6" y="6" width="88" height="88" rx="20" ry="20" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>

  <!-- Stylized Deep Blue Calendar Ticket -->
  <!-- Ticket Body with cutouts -->
  <g fill="#1E3A8A">
    <!-- Top Calendar Header -->
    <path d="M 24 28 C 24 25.8 25.8 24 28 24 L 72 24 C 74.2 24 76 25.8 76 28 L 76 38 L 24 38 Z" />
    
    <!-- Calendar Rings / Pegs -->
    <rect x="34" y="19" width="5" height="10" rx="2.5" fill="#0F172A"/>
    <rect x="61" y="19" width="5" height="10" rx="2.5" fill="#0F172A"/>

    <!-- Ticket Bottom Part with side notch cutouts -->
    <path d="M 24 40 L 76 40 L 76 52 C 71.5 52 68 55.5 68 60 C 68 64.5 71.5 68 76 68 L 76 72 C 76 74.2 74.2 76 72 76 L 28 76 C 25.8 76 24 74.2 24 72 L 24 68 C 28.5 68 32 64.5 32 60 C 32 55.5 28.5 52 24 52 Z" />
  </g>

  <!-- Dashed Tear Line across ticket -->
  <line x1="33" y1="60" x2="67" y2="60" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round"/>

  <!-- Calendar grid marks / Date indicator -->
  <circle cx="38" cy="48" r="2.5" fill="#FFFFFF"/>
  <circle cx="50" cy="48" r="2.5" fill="#FFFFFF"/>
  <circle cx="62" cy="48" r="2.5" fill="#FFFFFF"/>
  <circle cx="44" cy="68" r="2" fill="#93C5FD"/>
  <circle cx="56" cy="68" r="2" fill="#93C5FD"/>

  <!-- Orange Accent Star in the Upper Right Corner -->
  <g transform="translate(68, 14)">
    <path d="M 10 0 L 12.8 6.4 L 19.8 7.1 L 14.5 11.8 L 16 18.7 L 10 15.2 L 4 18.7 L 5.5 11.8 L 0.2 7.1 L 7.2 6.4 Z" fill="#F59E0B" stroke="#D97706" stroke-width="0.8"/>
  </g>
</svg>
